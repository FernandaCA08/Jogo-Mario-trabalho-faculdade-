<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/style.css">
    <script src="./script.js" defer></script>

    <title>Mario Jump</title>                                                                                                                                                                                 
</head>
<body>


    <div class="game-board"> 

        <div class="chat-container">
            <div class="chat-messages" id="chat-messages">
                <div><strong>Bot:</strong> Pressione qualquer tecla para pular!</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Escreva algo...">
            </div>
        </div>

        <div class="score">SCORE: 0</div>
        <img src="../img/clouds.png" alt="clouds" class="clouds">
        <img src="../img/mario.gif" alt="mario" class="mario">
        <img src="../img/pipe.png" alt="pipe" class="pipe">
        

    </div>


</body>
</html>
